  - type: dialog
    title: "Упр. 1 — Диалог 1 (послушай и повтори)"
    lines:
      - speaker: Lulu
        voice: lulu
        en: "Chuckles, come here!"
        ru: "Чаклз, иди сюда!"
        translit: "Чаклз, кам хиа!"
      - speaker: Larry
        voice: larry
        en: "Oh no! He's in the house!"
        ru: "О нет! Он в доме!"
        translit: "Оу ноу! Хиз ин зэ хаус!"
      - speaker: Lulu
        voice: lulu
        en: "Where's Mummy?"
        ru: "Где мама?"
        translit: "Уэаз мамми?"
      - speaker: Larry
        voice: larry
        en: "Look! Mummy's in the kitchen."
        ru: "Смотри! Мама на кухне."
        translit: "Лук! Мамми з ин зэ китчен."
  - type: dialog
    title: "Упр. 1 — Диалог 2 (послушай и повтори)"
    lines:
      - speaker: Larry
        voice: larry
        en: "Where's Daddy?"
        ru: "Где папа?"
        translit: "Уэаз дэдди?"
      - speaker: Lulu
        voice: lulu
        en: "He's in the bedroom."
        ru: "Он в спальне."
        translit: "Хиз ин зэ бэдрум."
      - speaker: Larry
        voice: larry
        en: "But where's Chuckles?"
        ru: "Но где Чаклз?"
        translit: "Бат уэаз Чаклз?"
      - speaker: Lulu
        voice: lulu
        en: "Quick! Let's go!"
        ru: "Быстрее! Пошли!"
        translit: "Квик! Летс гоу!"
